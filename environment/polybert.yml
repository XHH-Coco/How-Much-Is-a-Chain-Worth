#
# Phase P0 declaration. Installed on 2026-11-11 (Python 3.10.14).
# Reinstall with: conda env update -n DSC6020_Project_Polybert -f environment/polybert.yml --prune
# Separate environment only because the polyBERT weights (~7 GB) must be deletable on their own.
name: DSC6020_Project_Polybert
channels:
  - conda-forge
dependencies:
  - python=3.10.14
  - pip=24.3.1
  - pip:
      # cu121 作为主索引：PyPI 上的 torch 是 CPU 版，若用 --extra-index-url，
      # 同版本号会二选一，容易静默装成 CPU 版。故主索引指 cu121，PyPI 只作兜底。
      - --index-url https://download.pytorch.org/whl/cu121
      - --extra-index-url https://pypi.org/simple
      - torch==2.3.1
      - numpy==1.26.4
      - transformers==4.41.2
      - tokenizers==0.19.1
      - safetensors==0.4.3
      - sentencepiece==0.2.0
      - huggingface-hub==0.23.4
