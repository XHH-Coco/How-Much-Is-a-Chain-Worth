# 主表单元格口径 · 唯一出处（v2，2026-11-14 按 D-48 修订：A5 撤除，144 → 96）
# The main-table cell convention - the single source of truth (v2, revised 2026-11-14 per D-48:
# A5 withdrawn, 144 -> 96)
#
# 这份文件只做一件事：**把"主表一共多少条"算清楚，并写下来**。之后所有文档、所有交付说明只引
# 这里的 `expected_runs` 一个数，不许在别处另算一遍（分工_C-a §2 口径框：不许倒推）。
# This file does one thing: work out how many rows the main table has and write it down. Every
# later document cites this one number; nobody recomputes it elsewhere.

experiment: main_table
version: "2.0"
supersedes: "1.0（2026-11-13，144 口径，含 a5_chain）"
frozen_at: "2026-11-14"
owner: C-a
status: frozen

# ---- 0. 相对 v1 的唯一改动 ----
# The only change from v1.
revision_note: >-
  v1 把 a5_chain 算进主表（16 x 3 arms x 3 seeds = 144）。D-48 判定 A5 **不可构造**：三条链输入
  （重复单元数 / wPSMILES 连接权重 / 多单元序列）在现有数据里都不存在（D-47 实测），0 条记录。
  故主表只保留 A1 / A2 两臂：16 x 2 x 3 = 96。这不是"A5 增益为零"，是"A5 没有运行过"——
  状态一律写 not_constructible_data_unavailable，不许写 zero_gain。
  **96 条记录在改口径之前就已产出**（a1_floor 48 + a2_conventional 48），故不触发全表重跑；
  v1→v2 改的是条数声明，不是任何一条 run 的数字或 config_hash。

# ---- 1. 评估单元 = 16 ----
# Evaluation units = 16: six PolyBench tasks on their single official 70/30 split, plus two
# PolyBench26 tasks on each of five official folds.
units:
  polybench:
    folds_per_task: 1
    tasks:
      - pb_t1_tg
      - pb_t1_tm
      - pb_t2_modulus
      - pb_t2_permeability
      - pb_t3_dielectric_loss
      - pb_t3_iwlt
    subtotal: 6
  polybench26:
    folds_per_task: 5
    tasks:
      - pb26_polymetrix_tg
      - pb26_homopolymer_density
    subtotal: 10
  total: 16

# ---- 2. 两个经典臂 ----
# 每臂**只放一个学习器**进主表。主表之所以是 96 而不是母本的 150，见 expected_runs 的差额说明。
# One learner per arm in the main table; why 96 rather than the parent document's 150 is spelled
# out in expected_runs.discrepancy_note.
arms:
  a1_floor:        {learner: dummy_mean, in_main_table: true}
  a2_conventional: {learner: xgboost,    in_main_table: true}
excluded_arms:
  a5_chain:
    in_main_table: false
    runs: 0
    missing_reason: not_constructible_data_unavailable
    note: >-
      不是"零增益"结论。三条链输入在 `data/processed/structures/psmiles.parquet` 里都不存在
      （无 repeat count；wPSMILES 权重段 18,036 行逐字相同；无多单元序列列），草案停在
      `draft_blocked_pending_data`（D-47）。替代证据是 D-46 的零信息对照（nullcal，+3 列置换），
      它给"只增加维度"的 R² 地板。
sensitivity_learners:
  a2_conventional: [rf, knn]
  note: >-
    rf / knn 的数另存"学习器敏感性"表，**不进主表**。宽度不要混读：xgboost 入模 2,253 列；
    rf / knn 经 SimpleImputer 后是 **2,245** 列（8 个 BCUT2D 列在所有 pack 上恒 NaN，D-48）。

# ---- 3. 种子与条数 ----
seeds: [0, 1, 2]
expected_runs:
  per_arm: 48           # 16 单元 × 3 种子
  total: 96             # 16 单元 × 2 臂 × 3 种子
  breakdown:
    a1_floor: 48
    a2_conventional: 48
  formula: "6 (PolyBench) + 2x5 (PolyBench26) = 16 units; 16 x 2 arms x 3 seeds = 96"
  discrepancy_note: >-
    母本 §7.1 写 "150 fits"、C-1 又写 "96 classical + 48 GNN"。按本文件口径算出来是 96：
    150 − 96 = 54，其中 −48 是 A5 撤除（D-48，不可构造），−6 是"每臂只放一个学习器"
    （若 A2 把 RF / kNN 也放进主表就会多出来）。改口径 = 换本文件版本号并全表重跑，不许只改数字。

# ---- 4. 单元格定义 ----
cell:
  metric: r2                     # 记录里的 metrics.r2；mae / rmse 一并落盘但不进主表的判据
  aggregation: mean_over_seeds   # 主表一格 = 同一 (任务, 折, 臂) 三个种子的均值
  spread: sample_std_3_seeds     # 另一列给样本标准差（n=3），D 画误差棒用
  prediction_file: results/aggregate/predictions/<run_id>.parquet
  missing_cell: blocked_no_gpu   # 缺格留灰标，**不许填 0、不许填均值**
  missing_reason_column: missing_reason
  missing_reason_note: >-
    主表的缺格列名是 `missing_reason`，取值 `blocked_no_gpu` / `not_constructible_data_unavailable`。
    这两个枚举只属于这张表；run 记录的 `status`（ok / blocked_no_gpu / failed）回答的是
    "这次运行怎么了"，两者不是一回事，不要互相借用（D-48）。
  index_for_cc: results/aggregate/a1_a2_index.csv
  index_note: >-
    C-c 只读 a1_a2_index.csv 填表，不去翻 96 个 JSON；每一格都能点回 run_id。

# ---- 5. 与 A3/A4 的关系 ----
# A3/A4 的 48+48 条由 B 交付，不在本文件的 expected_runs 里（那两列的口径见分工_B）。
other_arms:
  a3_graph: {owner: B, runs: 48}
  a4_polybert: {owner: B, runs: 48}
  note: >-
    主表四列 = A1 / A2（C）+ A3 / A4（B），8 任务 x 4 臂 = **32 格**；同任务、同折、同种子才能逐格相减。
