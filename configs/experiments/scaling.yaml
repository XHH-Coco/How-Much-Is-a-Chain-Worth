# PolyBench26 数据量扫描（scaling）· 冻结配置 v1
# PolyBench26 data-size scan (scaling) - frozen config v1
#
# 冻结于 2026-11-14。**本文件的字节哈希就是这批记录的 `config_hash`**，所以跑之前改一个空格，
# 已有的拟合全部作废。
# Frozen on 2026-11-14. This file's byte hash is the `config_hash` of these records, so editing a
# single space before a run invalidates every fit already on disk.
#
# 这份配置管的是"H2 的横轴"：同一个任务、同一份官方五折、**只换训练集大小**。
# 档位不是我们挑的——`splits/polybench26/pb26_scaling_cp/<dataset>/seed_42/manifest.json` 的
# `train_sizes` 就是官方档位（交替 300/1000/3000/10000，均聚 300/1000，见官方 README），
# 每个数据集再加一个 `all`（全池）当 κ 曲线右端的锚点。**缺档是事实，不是失败**：
# 均聚 Cp 官方就没有 3000 / 10000，硬凑会让曲线失真（分工_C-b §7 常见坑）。
# This config owns H2's x axis: one task, the official five folds, and **only the training-set size
# changes**. The tiers are not ours to choose - the official manifest's `train_sizes` are the tiers
# (alternating 300/1000/3000/10000, homopolymer 300/1000 per the official README), plus one `all`
# level per dataset as the right-hand anchor of the kappa curve. A missing tier is a fact, not a
# failure: padding the homopolymer Cp to five tiers would distort the curve.
#
# 与 `pb26_scaling_cp.yaml` 的分工：那份是**任务身份**（数据集、行数、官方索引路径，A-4 冻结），
# 这份是**拟合矩阵**（档位 × 折 × 学习器，`scripts/04_run_cpu.py scaling`）。两份都只读。
# Division of labour with pb26_scaling_cp.yaml: that file is the task's identity (frozen by A-4),
# this one is the fit matrix. Neither is edited by the run.

arm: a2_conventional
experiment: scaling
version: "1.0"
frozen_at: "2026-11-14"
owner: C-b

# ---- 超参：与 A2 完全同一份冻结表，一个都不许重搜 ----
# Hyper-parameters: the same frozen A2 table, nothing re-searched.
learner:
  main: xgboost
  params: {}                 # 空 = 从 results/aggregate/a2_best_params.csv 取 (pb26_scaling_cp, xgboost)
  fixed:
    n_jobs: 1                # 线程调度会改变浮点求和顺序：n_jobs 是随机源（分工_C-a §2）
    tree_method: hist
    random_state: from_seed
  secondary:
    learner: rf
    params_from: configs/experiments/learner_sensitivity.yaml#learners.rf.fixed
    note: >-
      RF 一侧**只进 scaling_cpu.csv、不写 raw_runs**：`_schema.json` 的 arm 枚举里没有"森林"，
      写进去会让 C-c 的条数对账多出 40 条（D-45 的同款处理，C-a 的敏感性表也是这么落盘的）。
      它的超参抄的是官方 RDKit_RF 的 100 树配方（不调参），口径与 C-a §10 一致。

# ---- 档位取法：官方前缀 ----
# How a tier is drawn: the official prefix.
subset:
  rule: prefix               # `train_pool[:N]`，官方 create_scaling_splits.py 的定义（红线 1）
  nested: true               # 300 ⊂ 1000 ⊂ 3000 ⊂ 10000 ⊂ all
  train_only: true           # 只截训练集；验证集与测试集在所有档位上逐行不变
  seed: 0                    # prefix 规则不消耗随机数；留着这一行是为了让字段形状与 OpenPoly 一致

# ---- 网格：一个任务、两个数据集、8 个档位 × 5 折 × 2 学习器 = 80 fits ----
# The grid: one task, two datasets, 8 tiers x 5 folds x 2 learners = 80 fits.
expected_fits: 80
seeds: [0]                   # scaling 的"三个种子"换成"两个学习器"（分工_C-b C-b-1 的口径）
runs:
  polybench26:
    folds: [fold_00, fold_01, fold_02, fold_03, fold_04]
    tasks:
      - pb26_scaling_cp
datasets:
  # 顺序即输出顺序；档位一律从各自的 manifest.json 读，不在这里写第二遍。
  # Order is output order; tiers are always read from each manifest, never restated here.
  - dataset_id: md5000_alternating_cp
    tiers_expected: [300, 1000, 3000, 10000, all]
  - dataset_id: md5000_homopolymer_cp
    tiers_expected: [300, 1000, all]
learners: [xgboost, rf]

# ---- 设备：全程 CPU（分工_C-b §4：这一份 0 条 GPU 记录）----
device:
  prefer: cpu
  note: 经典臂在 CPU 上跑；device 由脚本填成 "cpu"。

# ---- 预算（分工_C-b §4：60–80 fits，最大 22,242 × 2,253，单条 20–60 秒）----
budget:
  predicted_gpu_hours: [0.0, 0.0]
  per_run_minutes: [0.05, 6.0]
  note: >-
    最贵的是交替 Cp 的 all 档（22,242 行 × 2,253 列）：XGBoost 单条约 20–60 秒，
    RF（100 树、n_jobs=1）单条约 3–4 分钟——两条学习器的墙钟不可比，读数时按 learner 分开看。
    造特征（29,602 行、唯一结构各算一次）另计约 3–5 分钟。

# ---- 记录 ----
records:
  raw_runs: results/raw_runs
  predictions: results/aggregate/predictions
  gpu_hours: results/aggregate/gpu_hours.csv
  table: results/aggregate/scaling_cpu.csv
  features_manifest: data/manifests/scaling_features_manifest.csv
  env_fingerprint: results/env_fingerprints/env_core.json
