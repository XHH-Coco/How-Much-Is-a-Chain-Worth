# FROZEN v2 | 2026-11-17 | sha256 见 configs/tasks/SHA256SUMS（自指，故登记配套文件）
#
# v1 → v2 只动 `arms` 一行：加 `a3_graph`。**数据集、档位、划分、行数、单位一个字节都没动**，
# 所以 v1 时期跑出的 40 条 A2 记录仍然成立——它们的 `config_hash` 是 `scaling.yaml` 的字节哈希，
# 不是这个文件的（实测 40/40 条记录的 `config_hash` 都是 `sha256:60841fcd…`）。
# 唯一的算术后果是 `eval_unit` 从"写着 2 arms 却只有 1 个"变成名副其实。
#
# 为什么必须补 A3：κ 的定义是 dΛ/dlog₁₀n，而 Λ 需要**两支**（链臂 − 单元臂）。v1 只声明了
# A2，于是 H2 的横轴齐了、纵轴缺一半（验收_P3_分工C-c §2 与 D-69 记的就是这一条）。
# v1 -> v2 adds `a3_graph` to `arms` and nothing else: the datasets, tiers, splits, row counts and
# units are byte-identical, so the 40 A2 records from v1 still stand - their `config_hash` is
# scaling.yaml's digest, not this file's. The chain arm is required because kappa = dLambda/dlog10 n
# needs both branches (chain minus unit); v1 declared only the unit arm.

task_id: pb26_scaling_cp
dataset_name: MD_5000 Cp (alternating + homopolymer)
benchmark: polybench26
role: mechanism
tier: null
tier_basis: 不适用：Proposal §3.1 表 C，机制实验不进主表
property: 等压热容 Cp（MD_5000，数据规模操纵）
target_column: Cp
target_unit: null
unit_status: not_required
unit_evidence: 机制实验只比较同一性质内的 RMSE，单位不进入 κ 或 Λ，故不为此猜单位；报告若需物理值须先补来源
source_kind: md
n_labels: 29602
n_source: 官方 manifest.json 的 n_rows 相加：27,802（alternating_Cp）+ 1,800（homopolymer_Cp），2026-11-12 本地核
data_ref: null
eval_unit: official tiers x 5 folds x 2 arms（A2 单元臂 A2 之外的那一支 = A3 链臂，D-69）
arms:
- a2_conventional
- a3_graph                   # v2 新增（D-69）：κ 的纵轴需要链臂，否则 40 条记录只有分母
split_ref: splits/polybench26/pb26_scaling_cp/
split_status: present
split_protocol: official_scaling_indices_5fold_seed42
status: available
datasets:
- dataset_id: md5000_alternating_cp
  n_rows: 27802
  train_sizes:
  - 300
  - 1000
  - 3000
  - 10000
  canonical_source: PSMILES/MD_5000/Cp/alternating_Cp.csv
  official_indices_path: Datasets/scaling_indices/MD_5000/Cp/alternating_Cp/seed_42
- dataset_id: md5000_homopolymer_cp
  n_rows: 1800
  train_sizes:
  - 300
  - 1000
  canonical_source: PSMILES/MD_5000/Cp/homopolymer_Cp.csv
  official_indices_path: Datasets/scaling_indices/MD_5000/Cp/homopolymer_Cp/seed_42
notes: 只承担 H2（κ）。拟合矩阵（档位 × 折 × 臂）由两份实验配置定义——单元臂 configs/experiments/scaling.yaml（C-b-1 冻结，80 行表）、链臂 configs/experiments/scaling_chain.yaml（D-69 新建，40 条记录），本文件只管任务身份。homopolymer 没有 3000 档是事实不是失败（官方 README）。
