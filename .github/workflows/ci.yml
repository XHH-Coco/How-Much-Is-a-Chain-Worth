name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: structure + unit tests (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: repository self-check
        run: python scripts/check_repo.py
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v

  env-pins:
    name: conda envs match pins.json (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
      - name: verify
        shell: bash -el {0}
        run: python environment/verify_env.py --strict
