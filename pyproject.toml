[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b2-chain-worth"
version = "0.1.0"
description = "How Much Is a Chain Worth? Chain-information recovery in polymer property prediction."
requires-python = ">=3.10,<3.11"
dependencies = []

[project.optional-dependencies]
core = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "scikit-learn==1.4.2",
    "xgboost==2.0.3",
    "rdkit==2024.3.5",
    "pysmiles==1.1.2",
    "statsmodels==0.14.2",
    "matplotlib==3.9.0",
]
gnn = [
    "torch==2.3.1",
    "torch-geometric==2.5.3",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "pytorch-lightning==2.3.0",
    "chemprop==2.1.0",
]
polybert = [
    "torch==2.3.1",
    "transformers==4.41.2",
    "tokenizers==0.19.1",
    "safetensors==0.4.3",
    "sentencepiece==0.2.0",
    "huggingface-hub==0.23.4",
]
dev = ["pytest==8.2.2"]

[project.scripts]
b2 = "b2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
b2 = ["py.typed"]
